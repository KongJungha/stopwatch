<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스톱워치</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --panel: #1a1d24;
    --text: #f2f3f5;
    --muted: #8a8f98;
    --accent: #4f8cff;
    --green: #34c759;
    --red: #ff453a;
    --orange: #ff9f0a;
    --bezel-1: #3a3d46;
    --bezel-2: #101216;
    --tick: #565a66;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 24px;
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 420px;
  }

  /* ---------- Sun ---------- */
  .sun-wrap {
    width: 96px;
    height: 96px;
    margin-bottom: -22px;
    position: relative;
    z-index: 3;
    filter: drop-shadow(0 0 18px rgba(255, 159, 10, 0.55));
    transition: filter 0.3s ease;
  }
  .sun-wrap.running {
    filter: drop-shadow(0 0 30px rgba(255, 123, 10, 0.85));
  }
  .sun-wrap svg { width: 100%; height: 100%; display: block; }
  .sun-rays {
    transform-origin: 50px 50px;
    animation: spin 4s linear infinite;
    animation-play-state: paused;
  }
  .sun-wrap.running .sun-rays { animation-play-state: running; }
  .sun-core {
    transform-origin: 50px 50px;
    animation: pulse 1.1s ease-in-out infinite;
    animation-play-state: paused;
  }
  .sun-wrap.running .sun-core { animation-play-state: running; }
  .sun-wrap.running { animation: bob 1.6s ease-in-out infinite; }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse {
    0%, 100% { transform: scale(1); filter: brightness(1); }
    50% { transform: scale(1.1); filter: brightness(1.3); }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* ---------- Crown ---------- */
  .crown {
    width: 40px;
    height: 26px;
    margin-bottom: -3px;
    z-index: 2;
    border-radius: 8px 8px 0 0;
    background: linear-gradient(180deg, #6b6f7a, #2b2d33);
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.15), inset 0 -2px 3px rgba(0,0,0,0.4);
  }

  /* ---------- Watch case ---------- */
  .watch {
    position: relative;
    width: 340px;
    height: 340px;
    max-width: 86vw;
    max-height: 86vw;
    border-radius: 50%;
    z-index: 1;
    background: radial-gradient(circle at 35% 30%, var(--bezel-1), var(--bezel-2) 70%);
    box-shadow:
      0 20px 45px rgba(0,0,0,0.5),
      inset 0 0 0 10px #14161b,
      inset 0 0 0 12px #3f434d;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ticks {
    position: absolute;
    inset: 0;
  }
  .tick {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 12px;
    background: var(--tick);
    border-radius: 1px;
    transform: translate(-50%, -50%) rotate(var(--a)) translateY(-148px);
  }
  .tick.major {
    width: 3px;
    height: 18px;
    background: var(--orange);
  }

  .face {
    position: relative;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #20232b, #131519 75%);
    box-shadow: inset 0 4px 10px rgba(0,0,0,0.6), inset 0 -2px 6px rgba(255,255,255,0.03);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .display {
    text-align: center;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin-bottom: 18px;
  }
  .display .main { font-size: 40px; line-height: 1; color: #ffffff; }
  .display .ms { font-size: 20px; color: #b5b8c0; }

  .controls {
    display: flex;
    gap: 8px;
  }
  button {
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #fff;
    transition: transform 0.08s ease, filter 0.15s ease;
  }
  button:active { transform: scale(0.94); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  #startStop { background: var(--green); }
  #startStop.running { background: var(--red); }
  #lap { background: #3a3d46; color: #ffffff; }
  #reset { background: var(--orange); }

  /* ---------- Laps card ---------- */
  .laps-card {
    width: 100%;
    max-width: 340px;
    margin-top: 24px;
    background: var(--panel);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .laps {
    max-height: 200px;
    overflow-y: auto;
  }
  .laps::-webkit-scrollbar { width: 6px; }
  .laps::-webkit-scrollbar-thumb { background: #3a3d46; border-radius: 3px; }
  .lap-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 16px;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid #22252c;
    color: var(--muted);
  }
  .lap-row:first-child { border-top-left-radius: 16px; border-top-right-radius: 16px; }
  .lap-row:last-child { border-bottom: none; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; }
  .lap-row .lap-index { color: var(--text); font-weight: 600; }
  .lap-row.fastest .lap-time { color: var(--green); }
  .lap-row.slowest .lap-time { color: var(--red); }
  .laps:empty::after {
    content: "랩 기록이 여기에 표시됩니다";
    display: block;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 18px 0;
  }

  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef0f3;
      --panel: #ffffff;
      --text: #1a1d24;
      --muted: #6b7078;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="sun-wrap" id="sun">
      <svg viewBox="0 0 100 100">
        <defs>
          <radialGradient id="sunGradient" cx="50%" cy="45%" r="60%">
            <stop offset="0%" stop-color="#fff6d6"/>
            <stop offset="35%" stop-color="#ffd23f"/>
            <stop offset="70%" stop-color="#ff9f0a"/>
            <stop offset="100%" stop-color="#ff5e2a"/>
          </radialGradient>
        </defs>
        <g class="sun-rays" stroke="#ffb03f" stroke-width="4" stroke-linecap="round">
          <line x1="50" y1="4" x2="50" y2="16"/>
          <line x1="50" y1="84" x2="50" y2="96"/>
          <line x1="4" y1="50" x2="16" y2="50"/>
          <line x1="84" y1="50" x2="96" y2="50"/>
          <line x1="17.6" y1="17.6" x2="26" y2="26"/>
          <line x1="74" y1="74" x2="82.4" y2="82.4"/>
          <line x1="17.6" y1="82.4" x2="26" y2="74"/>
          <line x1="74" y1="26" x2="82.4" y2="17.6"/>
        </g>
        <circle class="sun-core" cx="50" cy="50" r="23" fill="url(#sunGradient)"/>
      </svg>
    </div>
    <div class="crown"></div>

    <div class="watch">
      <div class="ticks" id="ticks"></div>
      <div class="face">
        <div class="display">
          <span class="main" id="time">00:00</span><span class="ms" id="millis">.00</span>
        </div>
        <div class="controls">
          <button id="lap" disabled>랩</button>
          <button id="startStop">시작</button>
          <button id="reset">리셋</button>
        </div>
      </div>
    </div>

    <div class="laps-card">
      <div class="laps" id="laps"></div>
    </div>
  </div>

<script>
  // build 12 tick marks around the watch face
  const ticksEl = document.getElementById('ticks');
  for (let i = 0; i < 12; i++) {
    const t = document.createElement('div');
    t.className = 'tick' + (i % 3 === 0 ? ' major' : '');
    t.style.setProperty('--a', (i * 30) + 'deg');
    ticksEl.appendChild(t);
  }

  let running = false;
  let startTime = 0;
  let elapsed = 0;
  let rafId = null;
  let laps = [];

  const timeEl = document.getElementById('time');
  const millisEl = document.getElementById('millis');
  const startStopBtn = document.getElementById('startStop');
  const lapBtn = document.getElementById('lap');
  const resetBtn = document.getElementById('reset');
  const lapsEl = document.getElementById('laps');
  const sunEl = document.getElementById('sun');

  function format(ms) {
    const totalMs = Math.floor(ms);
    const cs = Math.floor((totalMs % 1000) / 10);
    const totalSec = Math.floor(totalMs / 1000);
    const s = totalSec % 60;
    const m = Math.floor(totalSec / 60) % 60;
    const h = Math.floor(totalSec / 3600);
    const pad = (n, len = 2) => String(n).padStart(len, '0');
    const main = h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
    return { main, cs: pad(cs) };
  }

  function render(ms) {
    const { main, cs } = format(ms);
    timeEl.textContent = main;
    millisEl.textContent = '.' + cs;
  }

  function tick() {
    const now = performance.now();
    render(elapsed + (now - startTime));
    rafId = requestAnimationFrame(tick);
  }

  function start() {
    running = true;
    startTime = performance.now();
    rafId = requestAnimationFrame(tick);
    startStopBtn.textContent = '정지';
    startStopBtn.classList.add('running');
    lapBtn.disabled = false;
    sunEl.classList.add('running');
  }

  function stop() {
    running = false;
    elapsed += performance.now() - startTime;
    cancelAnimationFrame(rafId);
    startStopBtn.textContent = '시작';
    startStopBtn.classList.remove('running');
    lapBtn.disabled = true;
    sunEl.classList.remove('running');
  }

  function reset() {
    running = false;
    cancelAnimationFrame(rafId);
    elapsed = 0;
    laps = [];
    render(0);
    startStopBtn.textContent = '시작';
    startStopBtn.classList.remove('running');
    lapBtn.disabled = true;
    sunEl.classList.remove('running');
    renderLaps();
  }

  function currentElapsed() {
    return running ? elapsed + (performance.now() - startTime) : elapsed;
  }

  function addLap() {
    const total = currentElapsed();
    const prevTotal = laps.length ? laps[laps.length - 1].total : 0;
    laps.push({ total, split: total - prevTotal });
    renderLaps();
  }

  function renderLaps() {
    if (laps.length === 0) {
      lapsEl.innerHTML = '';
      return;
    }
    const splits = laps.map(l => l.split);
    const fastest = Math.min(...splits);
    const slowest = Math.max(...splits);
    const showBest = laps.length > 1;

    lapsEl.innerHTML = laps.map((l, i) => {
      const num = i + 1;
      let cls = 'lap-row';
      if (showBest && l.split === fastest) cls += ' fastest';
      if (showBest && l.split === slowest) cls += ' slowest';
      const { main: splitMain, cs: splitCs } = format(l.split);
      const { main: totalMain, cs: totalCs } = format(l.total);
      return `<div class="${cls}">
        <span class="lap-index">랩 ${num}</span>
        <span class="lap-time">${splitMain}.${splitCs}</span>
        <span class="lap-total">${totalMain}.${totalCs}</span>
      </div>`;
    }).reverse().join('');
  }

  startStopBtn.addEventListener('click', () => {
    if (running) stop(); else start();
  });
  lapBtn.addEventListener('click', addLap);
  resetBtn.addEventListener('click', reset);

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      startStopBtn.click();
    } else if (e.code === 'KeyL') {
      if (!lapBtn.disabled) lapBtn.click();
    } else if (e.code === 'KeyR') {
      resetBtn.click();
    }
  });

  render(0);
</script>
</body>
</html>
